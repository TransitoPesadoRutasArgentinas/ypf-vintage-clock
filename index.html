
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reloj YPF Vintage</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
  * { box-sizing: border-box; }

  :root {
    --azul: #07547d;
    --azul-oscuro: #082c42;
    --crema: #f0dfb7;
    --metal: #bd8b52;
    --oxido: #8d4728;
  }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 42%, #374044 0%, #171e21 52%, #080c0e 100%);
    color: var(--crema);
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
  }

  .escenario {
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 38px 12px 26px;
  }

  .surtidor {
    position: relative;
    width: min(86vw, 350px);
    height: 625px;
    border: 8px solid #13252b;
    border-radius: 68px 68px 15px 15px;
    background:
      radial-gradient(ellipse at 11% 15%, #b36b39 0%, transparent 15%),
      radial-gradient(ellipse at 92% 48%, #a45b30 0%, transparent 14%),
      radial-gradient(ellipse at 10% 83%, #9e522c 0%, transparent 16%),
      repeating-linear-gradient(
        112deg,
        transparent 0px,
        transparent 27px,
        #ffffff08 28px,
        transparent 30px
      ),
      linear-gradient(
        100deg,
        #062b42 0%,
        #0870a0 20%,
        #075c87 49%,
        #064366 77%,
        #032b45 100%
      );
    box-shadow:
      inset 0 0 0 5px #b8864c,
      inset 0 0 0 10px #082d40,
      inset 13px 0 25px #0007,
      inset -12px 0 25px #0008,
      15px 20px 30px #0009;
  }

  .surtidor::before {
    content: "";
    position: absolute;
    inset: 17px 15px 20px;
    border: 2px solid #c79a5b70;
    border-radius: 50px 50px 7px 7px;
    pointer-events: none;
  }

  .surtidor::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
      radial-gradient(ellipse at 17% 30%, #cf7a3830, transparent 20%),
      radial-gradient(ellipse at 88% 75%, #d17c3c3a, transparent 19%);
    pointer-events: none;
  }

  .cartel {
    position: absolute;
    z-index: 3;
    top: -54px;
    left: 50%;
    transform: translateX(-50%) rotate(-1.5deg);
    width: 88%;
    height: 118px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 55% / 50%;
    background:
      radial-gradient(ellipse at 65% 25%, #fff8e6, transparent 65%),
      linear-gradient(#f7eac8, #dec493);
    border: 7px solid #174a70;
    outline: 5px solid #b67d3f;
    box-shadow: 0 10px 14px #0009, inset 0 0 0 3px #a77b45;
  }

  .cartel span {
    font-family: Georgia, serif;
    font-weight: 900;
    font-size: clamp(54px, 17vw, 79px);
    letter-spacing: -6px;
    color: #124775;
    text-shadow: 1px 2px 1px #fff9;
  }

  .remaches {
    position: absolute;
    top: 91px;
    left: 23px;
    right: 23px;
    display: flex;
    justify-content: space-between;
  }

  .remaches i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #f6d49b, #644529 80%);
    box-shadow: 1px 2px 2px #0009;
  }

  .placa {
    position: absolute;
    z-index: 2;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    padding: 17px 12px 19px;
    border: 7px solid #b78953;
    border-radius: 24px;
    background:
      radial-gradient(ellipse at 75% 15%, #fff7dc, transparent 72%),
      linear-gradient(115deg, #d9c296, #f0dfb7 32%, #dbc196 100%);
    box-shadow:
      inset 0 0 0 3px #765738,
      inset 0 8px 18px #fff8,
      inset 0 -10px 15px #795a3c33,
      5px 9px 13px #0008;
  }

  .fila {
    margin-bottom: 13px;
  }

  .fila:last-child {
    margin-bottom: 0;
  }

  .rotulo {
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 5px;
    color: #58412b;
    margin-bottom: 7px;
    text-shadow: 0 1px #fff9;
  }

  .contador {
    display: flex;
    justify-content: center;
    gap: 7px;
  }

  .digito {
    position: relative;
    width: 58px;
    height: 69px;
    overflow: hidden;
    border: 3px solid #252b2a;
    border-radius: 7px;
    background: linear-gradient(
      to bottom,
      #c6bfae 0%,
      #f8f0da 17%,
      #e4dcc7 46%,
      #9d988b 49%,
      #4e4c46 50%,
      #c7c1b1 53%,
      #f4ead3 79%,
      #b2a99a 100%
    );
    box-shadow:
      inset 3px 0 5px #0007,
      inset -3px 0 5px #0007,
      2px 4px 5px #0006;
  }

  .numero {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #252b29;
    font-family: Georgia, serif;
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    text-shadow: 1px 2px #fff7;
    font-variant-numeric: tabular-nums;
  }

  .digito::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #332f2b70;
    box-shadow: 0 1px #fff6;
    pointer-events: none;
  }

  .numero.girando {
    animation: rodillo .42s cubic-bezier(.2,.7,.3,1);
  }

  @keyframes rodillo {
    0% { transform: translateY(-34%); filter: blur(2px); opacity: .55; }
    60% { transform: translateY(5%); filter: blur(.5px); opacity: 1; }
    100% { transform: translateY(0); filter: blur(0); opacity: 1; }
  }

  .marca {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 70px;
    text-align: center;
    color: #f2e1b9;
    text-shadow: 3px 5px 5px #001b2d;
  }

  .marca strong {
    display: block;
    font-size: 56px;
    letter-spacing: -3px;
    line-height: .95;
  }

  .marca small {
    display: block;
    font-size: 13px;
    letter-spacing: 7px;
    margin-top: 8px;
  }

  .rayas {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    margin-top: 11px;
  }

  .rayas span {
    height: 4px;
    background: #ead4a3;
    transform: skewX(-35deg);
    box-shadow: 1px 2px 2px #0007;
  }

  .rayas span:nth-child(1) { width: 105px; }
  .rayas span:nth-child(2) { width: 87px; }
  .rayas span:nth-child(3) { width: 68px; }

  .base {
    position: absolute;
    z-index: 4;
    left: -15px;
    right: -15px;
    bottom: -13px;
    height: 32px;
    border: 4px solid #553b28;
    border-radius: 5px;
    background: linear-gradient(#f0c58b, #a56e3d 50%, #583a26);
    box-shadow: inset 0 3px #ffe1a6, 0 8px 12px #0008;
  }

  .manguera {
    position: absolute;
    z-index: 0;
    right: -43px;
    top: 178px;
    width: 64px;
    height: 285px;
    border: 16px solid #171c1d;
    border-left: 0;
    border-radius: 0 55px 80px 0;
    filter: drop-shadow(5px 6px 4px #0009);
  }

  .pistola {
    position: absolute;
    z-index: 4;
    right: -29px;
    top: 250px;
    width: 25px;
    height: 145px;
    border: 3px solid #4b4b40;
    border-radius: 14px 14px 9px 9px;
    background: linear-gradient(90deg, #514e3e, #e6d6ae 35%, #807a65 75%, #383b36);
    transform: rotate(14deg);
    box-shadow: 3px 5px 6px #0008;
  }

  .pie {
    position: absolute;
    bottom: -61px;
    width: 100%;
    text-align: center;
    color: #b7a991;
    font-size: 11px;
    letter-spacing: 3px;
  }

  @media (max-height: 760px) {
    .escenario {
      align-items: flex-start;
      padding-top: 70px;
      padding-bottom: 75px;
    }
  }

  @media (max-width: 370px) {
    .surtidor { width: 82vw; height: 590px; }
    .placa { top: 132px; padding: 12px 7px; }
    .digito { width: 51px; height: 62px; }
    .numero { font-size: 46px; }
    .fila { margin-bottom: 10px; }
    .marca { bottom: 57px; }
    .marca strong { font-size: 48px; }
    .manguera { right: -35px; }
    .pistola { right: -25px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .numero.girando { animation: none; }
  }
</style>
</head>
<body>
<main class="escenario">
  <div class="surtidor" aria-label="Reloj YPF vintage">
    <div class="cartel"><span>YPF</span></div>

    <div class="remaches"><i></i><i></i></div>

    <div class="placa">
      <div class="fila">
        <div class="rotulo">HORAS</div>
        <div class="contador" id="horas"></div>
      </div>
      <div class="fila">
        <div class="rotulo">MINUTOS</div>
        <div class="contador" id="minutos"></div>
      </div>
      <div class="fila">
        <div class="rotulo">SEGUNDOS</div>
        <div class="contador" id="segundos"></div>
      </div>
    </div>

    <div class="marca">
      <strong>YPF</strong>
      <small>SÚPER</small>
      <div class="rayas">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="manguera"></div>
    <div class="pistola"></div>
    <div class="base"></div>
    <div class="pie">RELOJ MECÁNICO · VINTAGE</div>
  </div>
</main>

<script>
(function () {
  "use strict";

  const anteriores = {
    horas: "",
    minutos: "",
    segundos: ""
  };

  function crearDigitos(id) {
    const contenedor = document.getElementById(id);

    for (let i = 0; i < 2; i++) {
      const caja = document.createElement("div");
      caja.className = "digito";

      const numero = document.createElement("span");
      numero.className = "numero";
      numero.textContent = "0";

      caja.appendChild(numero);
      contenedor.appendChild(caja);
    }
  }

  ["horas", "minutos", "segundos"].forEach(crearDigitos);

  function actualizarFila(id, valor) {
    if (anteriores[id] === valor) return;

    const numeros = document.querySelectorAll(
      "#" + id + " .numero"
    );

    for (let i = 0; i < 2; i++) {
      if (numeros[i].textContent !== valor[i]) {
        numeros[i].textContent = valor[i];

        numeros[i].classList.remove("girando");
        void numeros[i].offsetWidth;
        numeros[i].classList.add("girando");
      }
    }

    anteriores[id] = valor;
  }

  function actualizar() {
    const ahora = new Date();

    actualizarFila(
      "horas",
      String(ahora.getHours()).padStart(2, "0")
    );

    actualizarFila(
      "minutos",
      String(ahora.getMinutes()).padStart(2, "0")
    );

    actualizarFila(
      "segundos",
      String(ahora.getSeconds()).padStart(2, "0")
    );
  }

  actualizar();
  setInterval(actualizar, 200);
  document.addEventListener("visibilitychange", actualizar);
})();
</script>
</body>
</html>
