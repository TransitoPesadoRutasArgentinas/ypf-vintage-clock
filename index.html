
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reloj YPF Vintage</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #05090d;
  color: #f5ead2;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

.pantalla {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px 0;
}

/* Fotografía original del surtidor */
.reloj {
  position: relative;
  width: min(100vw, 640px);
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
  background: url("./icon-512.png") center / 100% 100% no-repeat;
  isolation: isolate;
}

/* Visor centrado sobre el panel crema */
.visor {
  position: absolute;
  z-index: 3;
  left: 41.2%;
  top: 32.4%;
  width: 24.5%;
  height: 26.8%;

  border: 1px solid #75502c;
  border-radius: 7%;

  background: radial-gradient(
    ellipse at 45% 20%,
    #fff2d1 0%,
    #e4c58f 65%,
    #b88b54 100%
  );

  box-shadow:
    inset 0 0 0 1px #ffebb8,
    inset 0 0 8px #65421e88,
    0 2px 5px #0009;

  /* Tres filas de igual altura */
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  align-items: stretch;
  justify-items: center;

  padding: 3% 2%;
  gap: 1%;
  overflow: hidden;
}

/* Cada fila ocupa exactamente un tercio */
.fila {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4%;
  overflow: hidden;
}

/* Rótulos */
.rotulo {
  flex: 0 0 auto;
  width: 100%;
  text-align: center;

  font-family: Arial, sans-serif;
  font-size: clamp(5px, 1.45vw, 9px);
  font-weight: 900;
  letter-spacing: 0;
  line-height: 1;

  color: #392817;
  text-shadow: 0 1px #fff8;
}

/* Contenedor de los dos rodillos */
.contador {
  flex: 1 1 auto;
  width: 88%;
  min-height: 0;

  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 4%;
}

/* Rodillos mecánicos */
.digito {
  position: relative;
  flex: 0 1 42%;
  min-width: 0;
  height: 100%;

  overflow: hidden;
  border: 1px solid #6e5a40;
  border-radius: 3px;

  background: linear-gradient(
    to bottom,
    #080808,
    #252420 42%,
    #050505 49%,
    #494640 50%,
    #171717 55%,
    #080808
  );

  box-shadow:
    inset 2px 0 3px #000,
    inset -2px 0 3px #000,
    0 2px 3px #0008;
}

/* Números centrados */
.numero {
  position: absolute;
  inset: 0;

  display: grid;
  place-items: center;

  font-family: "Courier New", monospace;
  font-size: clamp(11px, 3.2vw, 20px);
  font-weight: bold;
  line-height: 1;

  color: #fff2d7;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 3px #fff5;
}

/* Línea central del rodillo */
.digito::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: #000;
  box-shadow: 0 1px #ffffff35;
  pointer-events: none;
}

/* Movimiento mecánico */
.numero.girando {
  animation: rodillo .38s ease-out;
}

@keyframes rodillo {
  0% {
    transform: translateY(-42%);
    filter: blur(1.5px);
    opacity: .5;
  }

  65% {
    transform: translateY(5%);
    filter: blur(0);
    opacity: 1;
  }

  100% {
    transform: translateY(0);
    filter: blur(0);
    opacity: 1;
  }
}

/* Ajuste para pantallas pequeñas */
@media (max-width: 390px) {
  .visor {
    border-width: 1px;
  }

  .rotulo {
    font-size: 1.45vw;
  }

  .numero {
    font-size: 3.2vw;
  }

  .digito {
    border-width: 1px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .numero.girando {
    animation: none;
  }
}
</style>
</head>

<body>

<main class="pantalla">

  <div class="reloj" aria-label="Reloj YPF vintage">

    <div class="visor" role="timer">

      <div class="fila">
        <div class="rotulo">HORAS</div>
        <div class="contador" id="horas"></div>
      </div>

      <div class="fila">
        <div class="rotulo">MINUTOS</div>
        <div class="contador" id="minutos"></div>
      </div>

      <div class="fila">
        <div class="rotulo">SEGUNDOS</div>
        <div class="contador" id="segundos"></div>
      </div>

    </div>

  </div>

</main>

<script>
(function () {
  "use strict";

  const anteriores = {
    horas: "",
    minutos: "",
    segundos: ""
  };

  function crearDigitos(id) {
    const contenedor = document.getElementById(id);

    for (let i = 0; i < 2; i++) {
      const caja = document.createElement("div");
      caja.className = "digito";

      const numero = document.createElement("span");
      numero.className = "numero";
      numero.textContent = "0";

      caja.appendChild(numero);
      contenedor.appendChild(caja);
    }
  }

  ["horas", "minutos", "segundos"].forEach(crearDigitos);

  function actualizarFila(id, valor) {
    if (anteriores[id] === valor) return;

    const numeros = document.querySelectorAll(
      "#" + id + " .numero"
    );

    for (let i = 0; i < 2; i++) {
      if (numeros[i].textContent !== valor[i]) {
        numeros[i].textContent = valor[i];

        numeros[i].classList.remove("girando");

        void numeros[i].offsetWidth;

        numeros[i].classList.add("girando");
      }
    }

    anteriores[id] = valor;
  }

  function actualizar() {
    const ahora = new Date();

    actualizarFila(
      "horas",
      String(ahora.getHours()).padStart(2, "0")
    );

    actualizarFila(
      "minutos",
      String(ahora.getMinutes()).padStart(2, "0")
    );

    actualizarFila(
      "segundos",
      String(ahora.getSeconds()).padStart(2, "0")
    );
  }

  actualizar();

  setInterval(actualizar, 200);

  document.addEventListener(
    "visibilitychange",
    actualizar
  );

})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("Reloj YPF registrado"))
                  .catch(error => console.error(error));
                    });
                    }
                    </script>
                    
</body>
</html>
