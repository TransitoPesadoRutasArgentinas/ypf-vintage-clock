
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reloj YPF">
<title>Reloj YPF Vintage</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    background: #05090d;
    color: #f4e6c7;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
  }

  .pantalla {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
  }

  /*
    La imagen original es cuadrada.
    Todas las posiciones se calculan en
    porcentajes para conservar la proporción.
  */
  .reloj {
    position: relative;
    width: min(100vw, 640px);
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    background-image: url("./icon-512.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    isolation: isolate;
  }

  /*
    Panel sobre el visor original.
    Se mantiene dentro del cuerpo del surtidor.
  */
  .visor {
    position: absolute;
    z-index: 2;
    left: 43.1%;
    top: 34.3%;
    width: 20.7%;
    height: 23.7%;
    border-radius: 10%;
    padding: 5% 1.5% 1.2%;
    background:
      radial-gradient(
        ellipse at 50% 25%,
        #fff3d0,
        #e3bf85 65%,
        #b58a56 100%
      );
    border: 2px solid #7b532d;
    box-shadow:
      inset 0 0 0 1px #fce3a8,
      inset 0 0 9px #66401b88,
      0 0 3px #0009;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
  }

  .fila {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .rotulo {
    color: #312719;
    font-family: Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(5px, 1.25vw, 9px);
    line-height: 1;
    letter-spacing: .8px;
    text-align: center;
    text-shadow: 0 1px #fff8;
  }

  .contador {
    display: flex;
    justify-content: center;
    gap: 2px;
    width: 100%;
  }

  .digito {
    position: relative;
    width: 24%;
    aspect-ratio: .78;
    overflow: hidden;
    border-radius: 2px;
    border: 1px solid #98764d;
    background:
      linear-gradient(
        to bottom,
        #090909 0%,
        #24221e 45%,
        #050505 49%,
        #44413b 50%,
        #171717 54%,
        #090909 100%
      );
    box-shadow:
      inset 1px 0 3px #000,
      inset -1px 0 3px #000,
      0 1px 2px #0008;
  }

  .numero {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: "Courier New", monospace;
    font-weight: bold;
    font-size: clamp(10px, 3.2vw, 22px);
    color: #f8eed8;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 3px #ffffff55;
  }

  .digito::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: #000;
    box-shadow: 0 1px #ffffff25;
    pointer-events: none;
  }

  .numero.girando {
    animation: giro .36s ease-out;
  }

  @keyframes giro {
    0% {
      transform: translateY(-45%);
      filter: blur(1.5px);
      opacity: .45;
    }

    65% {
      transform: translateY(5%);
      filter: blur(0);
      opacity: 1;
    }

    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }

  /*
    En pantallas pequeñas, el reloj
    utiliza todo el ancho disponible.
  */
  @media (max-width: 390px) {
    .visor {
      border-width: 1px;
    }

    .contador {
      gap: 1px;
    }

    .rotulo {
      font-size: 1.35vw;
    }

    .numero {
      font-size: 3.4vw;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .numero.girando {
      animation: none;
    }
  }
</style>
</head>

<body>
<main class="pantalla">
  <div class="reloj" aria-label="Reloj YPF vintage">

    <div class="visor">
      <div class="fila">
        <div class="rotulo">HORAS</div>
        <div class="contador" id="horas"></div>
      </div>

      <div class="fila">
        <div class="rotulo">MINUTOS</div>
        <div class="contador" id="minutos"></div>
      </div>

      <div class="fila">
        <div class="rotulo">SEGUNDOS</div>
        <div class="contador" id="segundos"></div>
      </div>
    </div>

  </div>
</main>

<script>
(function () {
  "use strict";

  const anteriores = {
    horas: "",
    minutos: "",
    segundos: ""
  };

  function crearDigitos(id) {
    const contenedor = document.getElementById(id);

    for (let i = 0; i < 2; i++) {
      const caja = document.createElement("div");
      caja.className = "digito";

      const numero = document.createElement("span");
      numero.className = "numero";
      numero.textContent = "0";

      caja.appendChild(numero);
      contenedor.appendChild(caja);
    }
  }

  ["horas", "minutos", "segundos"].forEach(crearDigitos);

  function actualizarFila(id, valor) {
    if (anteriores[id] === valor) return;

    const numeros = document.querySelectorAll(
      "#" + id + " .numero"
    );

    for (let i = 0; i < 2; i++) {
      if (numeros[i].textContent !== valor[i]) {
        numeros[i].textContent = valor[i];

        numeros[i].classList.remove("girando");
        void numeros[i].offsetWidth;
        numeros[i].classList.add("girando");
      }
    }

    anteriores[id] = valor;
  }

  function actualizar() {
    const ahora = new Date();

    actualizarFila(
      "horas",
      String(ahora.getHours()).padStart(2, "0")
    );

    actualizarFila(
      "minutos",
      String(ahora.getMinutes()).padStart(2, "0")
    );

    actualizarFila(
      "segundos",
      String(ahora.getSeconds()).padStart(2, "0")
    );
  }

  actualizar();

  setInterval(actualizar, 200);

  document.addEventListener(
    "visibilitychange",
    actualizar
  );
})();
</script>
</body>
</html>
