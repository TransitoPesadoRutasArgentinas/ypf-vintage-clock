
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reloj YPF Vintage</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #05090d;
  color: #f5ead2;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

.pantalla {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px 0;
}

/* Fotografía original del surtidor */
.reloj {
  position: relative;
  width: min(100vw, 640px);
  aspect-ratio: 1 / 1;
  flex-shrink: 0;
  background: url("./icon-512.png") center / 100% 100% no-repeat;
  isolation: isolate;
}

/*
  Visor ampliado.
  Conserva su posición dentro del surtidor.
*/
.visor {
  position: absolute;
  z-index: 3;
  left: 41.2%;
  top: 32.4%;
  width: 24.5%;
  height: 26.8%;
  padding: 2.2% 1% 1.5%;
  border: 2px solid #75502c;
  border-radius: 9%;
  background:
    radial-gradient(
      ellipse at 45% 20%,
      #fff2d1 0%,
      #e4c58f 65%,
      #b88b54 100%
    );
  box-shadow:
    inset 0 0 0 1px #ffebb8,
    inset 0 0 8px #65421e88,
    0 2px 5px #0009;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-evenly;
}

.fila {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 0;
}

.rotulo {
  font-family: Arial, sans-serif;
  font-size: clamp(6px, 1.65vw, 11px);
  font-weight: 900;
  letter-spacing: .6px;
  color: #392817;
  line-height: 1;
  text-shadow: 0 1px #fff8;
}

.contador {
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 3px;
}

.digito {
  position: relative;
  width: 34%;
  aspect-ratio: .95;
  overflow: hidden;
  border: 1px solid #6e5a40;
  border-radius: 3px;
  background: linear-gradient(
    to bottom,
    #080808,
    #252420 42%,
    #050505 49%,
    #494640 50%,
    #171717 55%,
    #080808
  );
  box-shadow:
    inset 2px 0 3px #000,
    inset -2px 0 3px #000,
    0 2px 3px #0008;
}

.numero {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: "Courier New", monospace;
  font-size: clamp(13px, 4.6vw, 30px);
  font-weight: bold;
  color: #fff2d7;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 3px #fff5;
}

.digito::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: #000;
  box-shadow: 0 1px #ffffff35;
  pointer-events: none;
}

.numero.girando {
  animation: rodillo .38s ease-out;
}

@keyframes rodillo {
  0% {
    transform: translateY(-42%);
    filter: blur(1.5px);
    opacity: .5;
  }
  65% {
    transform: translateY(5%);
    filter: blur(0);
    opacity: 1;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

/* Pantallas pequeñas */
@media (max-width: 390px) {
  .visor {
    border-width: 1px;
  }

  .contador {
    gap: 2px;
  }

  .rotulo {
    font-size: 1.7vw;
  }

  .numero {
    font-size: 4.8vw;
  }
}

/* Evita animaciones si Android las tiene reducidas */
@media (prefers-reduced-motion: reduce) {
  .numero.girando {
    animation: none;
  }
}
</style>
</head>

<body>
<main class="pantalla">
  <div class="reloj" aria-label="Reloj YPF vintage">

    <div class="visor">

      <div class="fila">
        <div class="rotulo">HORAS</div>
        <div class="contador" id="horas"></div>
      </div>

      <div class="fila">
        <div class="rotulo">MINUTOS</div>
        <div class="contador" id="minutos"></div>
      </div>

      <div class="fila">
        <div class="rotulo">SEGUNDOS</div>
        <div class="contador" id="segundos"></div>
      </div>

    </div>

  </div>
</main>

<script>
(function () {
  "use strict";

  const anteriores = {
    horas: "",
    minutos: "",
    segundos: ""
  };

  function crearDigitos(id) {
    const contenedor = document.getElementById(id);

    for (let i = 0; i < 2; i++) {
      const caja = document.createElement("div");
      caja.className = "digito";

      const numero = document.createElement("span");
      numero.className = "numero";
      numero.textContent = "0";

      caja.appendChild(numero);
      contenedor.appendChild(caja);
    }
  }

  ["horas", "minutos", "segundos"].forEach(crearDigitos);

  function actualizarFila(id, valor) {
    if (anteriores[id] === valor) return;

    const numeros = document.querySelectorAll(
      "#" + id + " .numero"
    );

    for (let i = 0; i < 2; i++) {
      if (numeros[i].textContent !== valor[i]) {
        numeros[i].textContent = valor[i];

        numeros[i].classList.remove("girando");
        void numeros[i].offsetWidth;
        numeros[i].classList.add("girando");
      }
    }

    anteriores[id] = valor;
  }

  function actualizar() {
    const ahora = new Date();

    actualizarFila(
      "horas",
      String(ahora.getHours()).padStart(2, "0")
    );

    actualizarFila(
      "minutos",
      String(ahora.getMinutes()).padStart(2, "0")
    );

    actualizarFila(
      "segundos",
      String(ahora.getSeconds()).padStart(2, "0")
    );
  }

  actualizar();
  setInterval(actualizar, 200);

  document.addEventListener(
    "visibilitychange",
    actualizar
  );
})();
</script>
</body>
</html>
